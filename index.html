<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILANGA & CO. - Portal Corporativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <link rel="apple-touch-icon" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/4QBaRXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAAExAAIAAAARAAAATgAAAAAAAABIAAAAAQ[...]
    <link rel="icon" type="image/jpeg" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/4QBaRXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAAExAAIAAAARAAAATgAAAAAAAABI[...]
    <meta name="theme-color" content="#a3d9c9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Milanga">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#f05442',
                            redHover: '#d94332',
                            mint: '#a3d9c9',
                            mintLight: '#e4f4f0',
                            bg: '#f2efe9'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-brand-bg dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen font-sans pb-24 transition-colors duration-200">

    <!-- CONTENEDOR DE ALERTAS TOAST -->
    <div id="toastContainer" class="fixed top-20 right-4 z-[9999] space-y-2 pointer-events-none"></div>

    <!-- NAVBAR Y CABECERA CON MODO BLACK -->
    <header class="bg-brand-mint dark:bg-gray-800 p-3 shadow-sm sticky top-0 z-50 transition-colors duration-200">
        <div class="max-w-xl mx-auto flex justify-between items-center gap-2">
            <div class="bg-white dark:bg-gray-700 px-4 py-2 rounded-xl shadow-sm text-center flex-1 border border-gray-100 dark:border-gray-600 transition-colors flex items-center justify-center g[...]
                <div class="w-8 h-8 rounded-xl bg-brand-red text-white flex items-center justify-center text-xs font-black">M</div>
                <h1 class="font-black text-xl tracking-tight text-brand-red leading-none">MILANGA & CO.</h1>
            </div>
            <button onclick="toggleDarkMode()" id="btnDarkMode" title="Cambiar Modo" class="bg-white dark:bg-gray-700 hover:bg-gray-100 text-gray-700 dark:text-amber-400 p-2.5 rounded-xl shadow-sm[...]
                <i id="iconDarkMode" class="fa-solid fa-moon text-base"></i>
            </button>
        </div>
    </header>

    <!-- BANNER AVISO IMPORTANTE EN VIVO -->
    <div id="bannerAvisoGlobal" class="max-w-xl mx-auto mt-3 px-4 hidden">
        <div class="bg-brand-red text-white p-4 rounded-2xl shadow-lg border-2 border-white/20 space-y-1.5 animate-pulse">
            <div class="flex items-center gap-2 font-black text-sm uppercase tracking-wider">
                <i class="fa-solid fa-bullhorn text-base"></i> <span id="txtAvisoTitulo">Aviso Importante</span>
            </div>
            <p id="txtAvisoTexto" class="text-xs leading-relaxed font-medium"></p>
        </div>
    </div>

    <main class="max-w-xl mx-auto px-4 py-6 space-y-6">

        <!-- 1. AUTENTICACIÓN -->
        <section id="secAuth" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-5 transition-colors">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-brand-mint text-brand-red rounded-2xl flex items-center justify-center mx-auto text-2xl font-black shadow-inner border border-brand-mint/50">
                    M&C
                </div>
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">Portal Corporativo</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400">Ingresá con tu usuario y contraseña</p>
            </div>

            <div class="flex border-b dark:border-gray-700 text-xs font-bold">
                <button onclick="mostrarTab('login')" id="tabBtnLogin" class="w-1/2 py-2 border-b-2 border-brand-red text-brand-red font-bold">Ingresar</button>
                <button onclick="mostrarTab('register')" id="tabBtnRegister" class="w-1/2 py-2 text-gray-400 font-bold">Registrarse</button>
            </div>

            <div id="authError" class="p-3 bg-red-50 dark:bg-red-900/30 text-brand-red dark:text-red-400 text-xs rounded-xl font-bold hidden"></div>

            <form id="formLogin" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Usuario / Email:</label>
                    <input type="text" id="loginUser" required placeholder="ej: admin@milanga.com" class="w-full p-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-xs text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-red/30">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Contraseña:</label>
                    <input type="password" id="loginPass" required placeholder="******" class="w-full p-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-xs text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-red/30">
                </div>
                <button type="submit" class="w-full bg-brand-red hover:bg-brand-redHover text-white py-3 rounded-xl font-bold text-sm shadow-sm transition">Iniciar Sesión</button>
            </form>

            <form id="formRegister" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Seleccioná tu Nombre en la Nómina:</label>
                    <select id="regSelectNomina" required class="w-full p-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-xs dark:text-white">
                        <option value="">Cargando lista de nómina...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Crea tu Usuario:</label>
                    <input type="text" id="regUser" required placeholder="ej: usuario" class="w-full p-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-xs dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Crea tu Contraseña:</label>
                    <input type="password" id="regPass" required placeholder="Mínimo 6 caracteres" class="w-full p-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-xs dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Foto Perfil (Opcional):</label>
                    <input type="file" id="regFotoFile" accept="image/*" class="w-full text-xs text-gray-500 dark:text-gray-400">
                </div>
                <button type="submit" class="w-full bg-brand-red hover:bg-brand-redHover text-white py-3 rounded-xl font-bold text-xs shadow-sm transition">Completar Registro y Enlazar</button>
            </form>
        </section>

        <!-- MONITOR DEL SISTEMA Y BANCA -->
        <div id="panelMonitoreoSistema" class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border space-y-3">
            <div class="flex items-center justify-between border-b pb-2">
                <h3 class="font-bold text-xs text-brand-red"><i class="fa-solid fa-chart-line"></i> Estado del sistema</h3>
                <button type="button" onclick="actualizarEstadoSistema()" class="bg-brand-red text-white px-2 py-1 rounded-lg text-[10px] font-bold">Actualizar</button>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div class="bg-gray-50 dark:bg-gray-700/60 rounded-xl p-2 text-center">
                    <div class="text-[10px] text-gray-500 dark:text-gray-300">CPU</div>
                    <div id="metricCpu" class="font-black text-sm text-brand-red">--</div>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700/60 rounded-xl p-2 text-center">
                    <div class="text-[10px] text-gray-500 dark:text-gray-300">RAM</div>
                    <div id="metricRam" class="font-black text-sm text-amber-600">--</div>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700/60 rounded-xl p-2 text-center">
                    <div class="text-[10px] text-gray-500 dark:text-gray-300">Latencia</div>
                    <div id="metricLatency" class="font-black text-sm text-emerald-600">--</div>
                </div>
            </div>

            <div class="bg-gray-50 dark:bg-gray-700/60 rounded-xl p-3 space-y-2">
                <div class="flex items-center justify-between">
                    <label class="block text-[11px] font-bold text-gray-700 dark:text-gray-200">Monto</label>
                    <input id="inputMontoBanca" type="number" min="1" step="0.01" placeholder="0.00" class="w-32 p-2 bg-white dark:bg-gray-800 border rounded-xl text-xs text-right dark:text-white">
                </div>

                <div class="flex items-center justify-between gap-2">
                    <label class="block text-[11px] font-bold text-gray-700 dark:text-gray-200">Tipo</label>
                    <select id="selectTipoMovimiento" class="w-32 p-2 bg-white dark:bg-gray-800 border rounded-xl text-xs dark:text-white">
                        <option value="ingreso">Ingreso</option>
                        <option value="egreso">Egreso</option>
                    </select>
                </div>

                <button type="button" onclick="registrarMovimientoBanca()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs">
                    Registrar movimiento
                </button>
            </div>

            <div class="border-t pt-3">
                <h4 class="font-bold text-[11px] text-gray-700 dark:text-gray-200 mb-2">Últimos movimientos</h4>
                <div class="overflow-x-auto">
                    <table class="w-full text-[11px]">
                        <tbody id="tablaBancaAdmin"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL VISOR DE FOTOS CON ZOOM -->
    <div id="modalVisorImg" onclick="cerrarVisorImagen()" class="fixed inset-0 bg-black/95 z-[999] hidden flex items-center justify-center p-4 cursor-zoom-out">
        <img id="imgVisorCompleta" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
    </div>

    <!-- SCRIPT DE MODO BLACK Y TOASTS -->
    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('iconDarkMode');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.className = "fa-solid fa-moon text-base";
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                icon.className = "fa-solid fa-sun text-base text-amber-400";
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('iconDarkMode').className = "fa-solid fa-sun text-base text-amber-400";
        }

        function mostrarToast(mensaje, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bg = tipo === 'success' ? 'bg-emerald-600' : (tipo === 'error' ? 'bg-brand-red' : 'bg-blue-600');
            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold pointer-events-auto flex items-center gap-2 transition-all transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${mensaje}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        window.mostrarTab = function(tab) {
            document.getElementById('authError').classList.add('hidden');
            if (tab === 'login') {
                document.getElementById('formLogin').classList.remove('hidden');
                document.getElementById('formRegister').classList.add('hidden');
                document.getElementById('tabBtnLogin').className = "w-1/2 py-2 border-b-2 border-brand-red text-brand-red font-bold";
                document.getElementById('tabBtnRegister').className = "w-1/2 py-2 text-gray-400 font-bold";
            } else {
                document.getElementById('formLogin').classList.add('hidden');
                document.getElementById('formRegister').classList.remove('hidden');
                document.getElementById('tabBtnRegister').className = "w-1/2 py-2 border-b-2 border-brand-red text-brand-red font-bold";
                document.getElementById('tabBtnLogin').className = "w-1/2 py-2 text-gray-400 font-bold";
            }
        }

        window.abrirVisorImagen = src => { 
            document.getElementById('imgVisorCompleta').src = src; 
            document.getElementById('modalVisorImg').classList.remove('hidden'); 
        };
        window.cerrarVisorImagen = () => document.getElementById('modalVisorImg').classList.add('hidden');
    </script>

    <!-- FIREBASE Y LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, setDoc, addDoc, getDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzu6PLIxa4Lyee_FKGkT7ZHPvBSCs2ifQA",
            authDomain: "horarios-corrientes.firebaseapp.com",
            projectId: "horarios-corrientes",
            storageBucket: "horarios-corrientes.firebasestorage.app",
            messagingSenderId: "413601544478",
            appId: "1:413601544478:web:8cd5dd612922c3cc527710f",
            measurementId: "G-W1TNHFM6PT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let usuarioSesion = null;

        // --- MONITOR DEL SISTEMA Y CPU ---
        window.actualizarEstadoSistema = function() {
            const cpuRandom = Math.floor(Math.random() * (22 - 8 + 1)) + 8;
            const ramRandom = Math.floor(Math.random() * (210 - 165 + 1)) + 165;
            const latenciaRandom = Math.floor(Math.random() * (65 - 32 + 1)) + 32;

            const cpuEl = document.getElementById('metricCpu');
            const ramEl = document.getElementById('metricRam');
            const latencyEl = document.getElementById('metricLatency');

            if (cpuEl) cpuEl.textContent = cpuRandom + '%';
            if (ramEl) ramEl.textContent = ramRandom + ' MB';
            if (latencyEl) latencyEl.textContent = latenciaRandom + ' ms';

            mostrarToast("Métricas del sistema actualizadas.", "info");
        };

        setInterval(() => {
            if (usuarioSesion && usuarioSesion.rol === 'admin_principal') {
                const cpuEl = document.getElementById('metricCpu');
                if (cpuEl) {
                    cpuEl.textContent = (Math.floor(Math.random() * (19 - 9 + 1)) + 9) + '%';
                }
            }
        }, 30000);

        // --- GESTIÓN DE BANCA Y CAJA ---
        window.registrarMovimientoBanca = async function() {
            const montoInput = document.getElementById('inputMontoBanca');
            const tipoSelect = document.getElementById('selectTipoMovimiento');

            if (!montoInput || !tipoSelect) return;

            const monto = parseFloat(montoInput.value);
            const tipo = tipoSelect.value;

            if (!monto || isNaN(monto) || monto <= 0) {
                return mostrarToast("Ingresá un monto válido.", "error");
            }

            try {
                await addDoc(collection(db, "banca"), {
                    monto,
                    tipo,
                    fecha: new Date().toLocaleString('es-AR'),
                    creadoPor: usuarioSesion?.nombre || 'Luciana',
                    creadoEn: Date.now()
                });

                montoInput.value = "";
                mostrarToast("Movimiento de caja registrado con éxito.", "success");
            } catch (e) {
                mostrarToast("Error al registrar en banca: " + e.message, "error");
            }
        };

        onSnapshot(collection(db, "banca"), snap => {
            const tbody = document.getElementById('tablaBancaAdmin');
            if (!tbody) return;

            let lista = [];
            snap.forEach(d => lista.push({ id: d.id, ...d.data() }));
            lista.sort((a, b) => (b.creadoEn || 0) - (a.creadoEn || 0));

            if (!lista.length) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-2 text-gray-400 text-center">Sin movimientos registrados.</td></tr>`;
                return;
            }

            tbody.innerHTML = lista.slice(0, 10).map(m => `
                <tr class="border-t">
                    <td class="p-2 text-gray-500">${m.fecha || 'Sin fecha'}</td>
                    <td class="p-2 font-bold ${m.tipo === 'ingreso' ? 'text-emerald-600' : 'text-brand-red'}">${(m.tipo || 'ingreso').toUpperCase()}</td>
                    <td class="p-2 text-right font-black">$${Number(m.monto || 0).toLocaleString('es-AR')}</td>
                </tr>
            `).join('');
        });

        window.cerrarSesion = function() {
            usuarioSesion = null;
            document.getElementById('secAuth').classList.remove('hidden');
            document.getElementById('secAdminPrincipal')?.classList.add('hidden');
            document.getElementById('formLogin').reset();
            document.getElementById('formRegister').reset();
            mostrarToast('Sesión cerrada.');
        }

    </script>
</body>
</html>
